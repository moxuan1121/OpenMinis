name: iOS 15.6 build
on:
  workflow_dispatch:
  push:
    branches: [ios15.6]
permissions:
  contents: read
concurrency:
  group: ios15-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep Xcode
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Check iOS 15 fallbacks
        run: |
          python3 scripts/check_ios15_foundation.py
          python3 scripts/check_ios15_navigation.py
          python3 scripts/check_ios15_text_layout.py
      - name: Install build tools
        run: |
          brew install ninja llvm lld libarchive pkg-config meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache/restore@v4
        id: native
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
          key: ios15-native-${{ runner.os }}-${{ hashFiles('deps/*.sh', 'deps/rclone-mobile/go.*', '.gitmodules') }}
      - name: Build native dependencies
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive deps/ish
          bash deps/build_lame.sh
          bash deps/build_ffmpeg.sh
          bash deps/build_ish.sh
          bash deps/prepare_alpine_rootfs.sh
          bash deps/build_rclone_ios.sh
      - uses: actions/cache/save@v4
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
          key: ${{ steps.native.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: swift
        with:
          path: build
          key: ios15-swift-${{ runner.os }}-26-${{ github.sha }}
          restore-keys: ios15-swift-${{ runner.os }}-26-
      - name: Build for iOS 15.6
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log
      - name: Verify and package iOS 15 app
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Minis.app package/Payload/
          # Installers may launch an extension even when its minimum OS is newer.
          # These targets remain in normal builds for their supported systems.
          rm -rf package/Payload/Minis.app/PlugIns/AgentWidgetExtension.appex \
            package/Payload/Minis.app/PlugIns/MinisFileProvider.appex
          for dependency in package/Payload/Minis.app/Frameworks/*.framework package/Payload/Minis.app/Frameworks/*.dylib; do
            if [ -e "$dependency" ]; then codesign --force --sign - "$dependency"; fi
          done
          codesign --force --sign - --entitlements src/ios/ShareExtension/ShareExtension.entitlements \
            package/Payload/Minis.app/PlugIns/MinisShare.appex
          codesign --force --sign - --entitlements src/ios/Minis.entitlements package/Payload/Minis.app
          codesign --verify --deep --strict package/Payload/Minis.app
          python3 scripts/check_ios15_app.py package/Payload/Minis.app
          cd package
          zip -qr ../OpenMinis-iOS15.6-fixed.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-iOS15.6-fixed
          path: OpenMinis-iOS15.6-fixed.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios15-build-log
          path: |
            build.log
            src/ios/Minis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.swift.outputs.cache-hit != 'true'
        with:
          path: build
          key: ${{ steps.swift.outputs.cache-primary-key }}
